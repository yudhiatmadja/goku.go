{{define "content"}}
<style>
    @import url('https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;700;900&display=swap');

    .goku-welcome-container {
        font-family: 'Lexend', -apple-system, BlinkMacSystemFont, sans-serif;
        background: #050810;
        color: #ffffff;
        min-height: 90vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem;
        position: relative;
        overflow: hidden;
    }

    .goku-welcome-container::before {
        content: '';
        position: absolute;
        width: 100%;
        height: 100%;
        background: 
            linear-gradient(45deg, transparent 45%, rgba(0, 173, 216, 0.03) 45%, rgba(0, 173, 216, 0.03) 55%, transparent 55%),
            linear-gradient(-45deg, transparent 45%, rgba(0, 173, 216, 0.03) 45%, rgba(0, 173, 216, 0.03) 55%, transparent 55%);
        background-size: 60px 60px;
        opacity: 0.5;
        z-index: 0;
    }

    .content {
        max-width: 1100px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 3rem;
        background: rgba(10, 15, 25, 0.8);
        backdrop-filter: blur(10px);
        border-radius: 1rem;
        padding: 3rem;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        border: 1px solid rgba(0, 173, 216, 0.1);
        position: relative;
        z-index: 1;
    }

    @media (max-width: 768px) {
        .content {
            grid-template-columns: 1fr;
            gap: 2rem;
        }
        
        .right-section {
            order: -1;
        }
    }

    .left-section {
        display: flex;
        flex-direction: column;
        justify-content: center;
        text-align: left;
    }

    .right-section {
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
    }

    .logo-visual {
        position: relative;
        width: 280px;
        height: 280px;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .logo-circle {
        position: absolute;
        border: 2px solid rgba(0, 173, 216, 0.2);
        border-radius: 50%;
        animation: pulse 4s ease-in-out infinite;
    }

    .logo-circle:nth-child(1) {
        width: 200px;
        height: 200px;
        animation-delay: 0s;
    }

    .logo-circle:nth-child(2) {
        width: 240px;
        height: 240px;
        animation-delay: 0.5s;
    }

    .logo-circle:nth-child(3) {
        width: 280px;
        height: 280px;
        animation-delay: 1s;
    }

    @keyframes pulse {
        0%, 100% {
            transform: scale(1);
            opacity: 0.3;
        }
        50% {
            transform: scale(1.05);
            opacity: 0.6;
        }
    }

    .logo-center {
        position: relative;
        z-index: 2;
        width: 140px;
        height: 140px;
        background: linear-gradient(135deg, #00ADD8, #5DC9E2);
        border-radius: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: 'JetBrains Mono', monospace;
        font-size: 4rem;
        font-weight: 900;
        color: #050810;
        box-shadow: 0 20px 60px rgba(0, 173, 216, 0.3);
        animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
        0%, 100% {
            transform: translateY(0px);
        }
        50% {
            transform: translateY(-10px);
        }
    }

    .geometric-shapes {
        position: absolute;
        width: 100%;
        height: 100%;
        opacity: 0.1;
    }

    .shape {
        position: absolute;
        border: 2px solid #00ADD8;
    }

    .shape:nth-child(1) {
        width: 80px;
        height: 80px;
        top: 10%;
        left: 5%;
        transform: rotate(45deg);
        animation: rotate 15s linear infinite;
    }

    .shape:nth-child(2) {
        width: 60px;
        height: 60px;
        bottom: 15%;
        right: 10%;
        border-radius: 50%;
        animation: rotate 20s linear infinite reverse;
    }

    .shape:nth-child(3) {
        width: 100px;
        height: 100px;
        top: 50%;
        right: 5%;
        transform: rotate(15deg);
        animation: rotate 25s linear infinite;
    }

    @keyframes rotate {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }

    .title {
        font-size: 3.5rem;
        font-weight: 900;
        color: #ffffff;
        letter-spacing: -0.02em;
        margin-bottom: 0.5rem;
        line-height: 1.1;
    }

    .subtitle {
        font-size: 1.1rem;
        color: #94A3B8;
        margin-bottom: 2rem;
        font-weight: 400;
    }

    .getting-started {
        margin-top: 2rem;
        padding-top: 0;
        border-top: none;
    }
    
    .getting-started h2 {
        font-size: 1.5rem;
        font-weight: 700;
        color: #E2E8F0;
        margin-bottom: 1rem;
    }

    .getting-started p {
        color: #94A3B8;
        margin-bottom: 1.5rem;
        line-height: 1.7;
    }

    .info-list {
        list-style: none;
        padding: 0;
        margin-bottom: 2rem;
    }

    .info-list li {
        color: #94A3B8;
        margin-bottom: 0.75rem;
        padding-left: 1.5rem;
        position: relative;
    }

    .info-list li::before {
        content: '→';
        position: absolute;
        left: 0;
        color: #00ADD8;
        font-weight: bold;
    }

    .info-list li a {
        color: #5DC9E2;
        text-decoration: none;
        transition: color 0.3s ease;
    }

    .info-list li a:hover {
        color: #00ADD8;
    }

    .btn-docs {
        display: inline-block;
        background: linear-gradient(135deg, #00ADD8 0%, #5DC9E2 100%);
        color: #050810;
        padding: 0.875rem 2rem;
        border-radius: 0.5rem;
        text-decoration: none;
        font-weight: 700;
        transition: all 0.3s ease;
        box-shadow: 0 4px 15px rgba(0, 173, 216, 0.3);
        border: none;
        font-size: 14px;
        letter-spacing: 0.05em;
    }

    .btn-docs:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 25px rgba(0, 173, 216, 0.5);
        background: linear-gradient(135deg, #0096BE 0%, #4DB8D6 100%);
    }

</style>

<div class="goku-welcome-container">
    <div class="content">
        
        <div class="left-section">
            <div class="title">
                Goku Framework
            </div>
            <p class="subtitle">
                The elegant Go web framework for modern applications
            </p>

            <div class="getting-started">
                <h2>Let's get started</h2>
                <p>
                    Goku has an incredibly rich ecosystem. We suggest starting with the following:
                </p>
                <ul class="info-list">
                    <li>Read the <a href="/docs">Documentation</a></li>
                    <li>Explore the ecosystem</li>
                </ul>
                <a href="#" class="btn-docs">Deploy now</a>
            </div>
        </div>

        <div class="right-section">
            <div class="geometric-shapes">
                <div class="shape"></div>
                <div class="shape"></div>
                <div class="shape"></div>
            </div>
            <div class="logo-visual">
                <div class="logo-circle"></div>
                <div class="logo-circle"></div>
                <div class="logo-circle"></div>
                <div class="logo-center">G</div>
            </div>
        </div>

    </div>
</div>
{{end}}
